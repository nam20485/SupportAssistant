name: Build and Package

on:
  push:
    branches: [ main, master, develop, development, feature/* ]
  pull_request:
    branches: [ main, master, develop, development ]
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: SupportAssistant.sln
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # GitHub Packages auth for the private `intel-agency` feed hosting InferenceEngine.Core.
  # The default GITHUB_TOKEN is scoped to THIS repo (nam20485/SupportAssistant) and cannot read
  # intel-agency packages (different owner) — hence this must be a PAT (classic) with `read:packages`
  # belonging to a member of intel-agency, stored as the GH_PACKAGES_TOKEN repo secret.
  NUGET_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --verbosity normal --logger trx --results-directory "test-results"
    
    - name: Upload test results
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
      if: always()
      with:
        name: test-results
        path: test-results
        retention-days: 30
  
  package:
    name: Package Application
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    
    - name: Publish application
      run: |
        dotnet publish src/SupportAssistant/SupportAssistant.csproj `
          --configuration Release `
          --runtime ${{ matrix.runtime }} `
          --no-restore `
          --output dist/${{ matrix.runtime }}
    
    - name: Create portable package
      run: |
        $version = "1.0.0"
        if ($env:GITHUB_REF -like "refs/tags/v*") {
          $version = $env:GITHUB_REF -replace "refs/tags/v", ""
        }
        Compress-Archive -Path "dist/${{ matrix.runtime }}/*" -DestinationPath "SupportAssistant-$version-${{ matrix.runtime }}-portable.zip"
    
    - name: Upload portable package
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
      with:
        name: SupportAssistant-${{ matrix.runtime }}-portable
        path: SupportAssistant-*-${{ matrix.runtime }}-portable.zip
        retention-days: 90
    
    - name: Upload to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} `
          SupportAssistant-*-${{ matrix.runtime }}-portable.zip `
          --clobber
  
  msix-package:
    name: Create MSIX Package
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Add Windows App SDK
      run: dotnet add src/SupportAssistant/SupportAssistant.csproj package Microsoft.WindowsAppSDK
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    
    - name: Build MSIX package
      # Best-effort: full MSIX packaging requires a Windows TFM
      # (net10.0-windows10.0.x.0), a Package.appxmanifest/identity, and code
      # signing config that are not yet set up. continue-on-error keeps the
      # workflow green; the .msix is produced only when that config exists.
      continue-on-error: true
      run: |
        dotnet publish src/SupportAssistant/SupportAssistant.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output dist/msix `
          --no-restore `
          /p:WindowsPackageType=MSIX `
          /p:GenerateAppInstallerFile=true
    
    - name: Upload MSIX package
      if: success()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
      with:
        name: SupportAssistant-MSIX
        path: dist/msix/*.msix
        retention-days: 90
